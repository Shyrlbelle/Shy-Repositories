
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pink Website 🎀</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff0f5;
            color: #805568;
            text-align: center;
        }

        header {
            background-color: #f8c8dc;
            padding: 25px;
        }

        header h1 {
            color: #a64d79;
            font-size: 32px;
        }

        nav {
            background-color: #fce4ec;
            padding: 15px;
        }

        nav a {
            color: #a64d79;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #e75480;
        }

        .container {
            padding: 60px 20px;
        }

        .card {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(220, 130, 160, 0.2);
        }

        .card h2 {
            color: #d16b91;
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.8;
        }

        button {
            background-color: #f4a6c1;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #e88aaa;
        }

        footer {
            background-color: #f8c8dc;
            padding: 20px;
            margin-top: 60px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌸 Welcome to My Website 🌸</h1>
        <p>A little world of pink and happiness ♡</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="container" id="home">
        <div class="card">
            <h2>♡ Hello, Welcome! ♡</h2>
            <p>
                Welcome to my little corner of the internet!
                Everything here is made with love, soft pink colors,
                and a little bit of magic. 🎀
            </p>

            <button onclick="alert('Have a lovely day! 💗')">
                Click Me ♡
            </button>
        </div>
    </section>

    <footer>
        <p>Made with 💗 | My Pink Website © 2026</p>
    </footer>

</body>
</html>
